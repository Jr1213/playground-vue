<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sides</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: content-box;
            font-family: "Poppins", serif;

        }

        .wrapper {
            width: 100%;
            height: 100vh;
            display: flex;
        }

        .wrapper .side {
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .side.black {
            background-color: #000;
        }

        .side.white {
            background-color: #fff;
        }

        .side h3 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .side p {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .whtie h3,
        .whtie p,
        .whtie .max {
            color: #000;
        }

        .black h3,
        .black p,
        .black .max {
            color: #fff;
        }

        .side .btn {
            all: unset;
            cursor: pointer;
        }

        .max {
            font-size: 3rem;
            margin: 1rem 0;
        }
    </style>
</head>

<body>
    <div class="wrapper" id="app">
        <black-button max:20 start:5 step:5 />
        <white-button />

    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script type="module">
        const { createApp } = Vue
        import BlackButton from './app/BlackButton.js';
        import WhiteButton from './app/WhiteButton.js';
        console.log(WhiteButton);

        const app = {
            components: {
                'black-button': BlackButton,
                'white-button': WhiteButton
            }
        }
        createApp(app).mount('#app')
    </script>
</body>

</html>
